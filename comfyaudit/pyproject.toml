[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyaudit"
version = "0.1.0"
description = "Evaluate and audit ComfyUI workflows: models, licences, provenance, prompts, assets, automation level and production risk."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Doug Hogan" }]
keywords = ["comfyui", "vfx", "pipeline", "audit", "licensing", "stable-diffusion"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
# Deliberately dependency-free: this has to install cleanly next to a ComfyUI
# environment without dragging anything into it.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
comfyaudit = "comfyaudit.cli:main"

[tool.setuptools.packages.find]
include = ["comfyaudit*"]

[tool.setuptools.package-data]
comfyaudit = ["knowledge/data/*.json", "knowledge/data/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
