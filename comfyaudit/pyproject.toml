[project]
name = "comfyaudit"
description = "Audit a ComfyUI workflow: every model and its licence, prompt and asset provenance, how much human intervention it needs, and what will break in production."
version = "0.3.0"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Doug Hogan" }]
keywords = ["comfyui", "vfx", "pipeline", "audit", "licensing", "clearance", "claude"]

# The auditor itself is standard library only, so it cannot break a ComfyUI
# environment. The Anthropic SDK is needed only for the Claude review node and
# the plugin degrades gracefully without it.
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/dughogan/dughogan"

[tool.comfy]
PublisherId = "dughogan"
DisplayName = "ComfyAudit"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
