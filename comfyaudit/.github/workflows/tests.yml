name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The pack directory is the Python package, so it may sit at the repo root
      # (standalone) or one level down (vendored). Find it rather than assume.
      - id: pack
        run: |
          if [ -f pyproject.toml ]; then echo "dir=." >> "$GITHUB_OUTPUT"
          else echo "dir=comfyaudit" >> "$GITHUB_OUTPUT"; fi

      # comfyaudit itself has no dependencies. The Anthropic SDK is installed
      # only so the agent tests run instead of skipping.
      - run: pip install pytest anthropic
      - run: python -m pytest -q
        working-directory: ${{ steps.pack.outputs.dir }}
